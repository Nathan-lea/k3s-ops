apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-operator
  namespace: operator-demo
  labels:
    app.kubernetes.io/name: webapp-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: webapp-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webapp-operator
    spec:
      serviceAccountName: webapp-operator
      # 镜像只导入了 agent-1 的 containerd，因此把 Pod 钉到这台节点。
      nodeSelector:
        kubernetes.io/hostname: k3s-demo-agent-1
      containers:
        - name: manager
          image: webapp-operator:v0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - --metrics-bind-address=:8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
