# ~/k3s-ops/tmp/sched-demo.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sched-demo
  namespace: lab
spec:
  replicas: 2
  selector:
    matchLabels: { app: sched-demo }
  template:
    metadata:
      labels: { app: sched-demo }
    spec:
      nodeSelector:
        disktype: hdd          # 只有带 hdd 标签的节点才会被选中
      containers:
        - name: nginx
          image: nginx:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
