# ~/k3s-ops/tmp/probe-demo.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe-demo
  namespace: lab
spec:
  replicas: 2
  selector:
    matchLabels: { app: probe-demo }
  template:
    metadata:
      labels: { app: probe-demo }
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-demo-server-1
      containers:
        - name: nginx
          image: nginx:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 3     # 启动后等 3 秒再开始探测
            periodSeconds: 5           # 每 5 秒探一次
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
