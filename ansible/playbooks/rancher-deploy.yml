---
- name: Deploy Rancher on k3s cluster
  hosts: server[0]
  gather_facts: true

  tasks:
    - name: Ensure helm binary is installed
      shell: |
        if ! command -v helm &> /dev/null; then
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: Add jetstack repo for cert-manager
      kubernetes.core.helm_repository:
        name: jetstack
        repo_url: https://charts.jetstack.io

    - name: Add rancher-stable repo
      kubernetes.core.helm_repository:
        name: rancher-stable
        repo_url: https://releases.rancher.com/server-charts/stable

    - name: Create cert-manager namespace
      kubernetes.core.k8s:
        name: cert-manager
        api_version: v1
        kind: Namespace
        state: present

    - name: Install cert-manager
      kubernetes.core.helm:
        name: cert-manager
        chart_ref: jetstack/cert-manager
        chart_version: "{{ addons.cert_manager_version | default('v1.15.0') }}"
        release_namespace: cert-manager
        release_state: present
        update_repo: true
        set_values:
          - value: installCRDs=true
          - value: extraArgs={--dns01-recursive-nameservers=8.8.8.8:53,1.1.1.1:53}

    - name: Wait for cert-manager pods
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: cert-manager
        field_selectors:
          - status.phase=Running
      register: cert_pods
      until: cert_pods.resources | length >= 3
      retries: 30
      delay: 10

    - name: Create cattle-system namespace
      kubernetes.core.k8s:
        name: cattle-system
        api_version: v1
        kind: Namespace
        state: present

    - name: Install Rancher
      kubernetes.core.helm:
        name: rancher
        chart_ref: rancher-stable/rancher
        chart_version: "{{ addons.rancher.version | default('2.9.0') }}"
        release_namespace: cattle-system
        release_state: present
        update_repo: true
        set_values:
          - value: "hostname={{ addons.rancher.hostname | default('rancher.k3s.local') }}"
          - value: "bootstrapPassword={{ addons.rancher.bootstrap_password | default('admin') }}"
          - value: "replicas=1"
          - value: "service.type=NodePort"
          - value: "service.nodePort=30443"
          - value: "ingress.enabled=false"

    - name: Wait for Rancher deployment
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: cattle-system
        label_selectors:
          - app=rancher
      register: rancher_pods
      until: rancher_pods.resources | selectattr('status.phase', 'equalto', 'Running') | list | length >= 1
      retries: 30
      delay: 10

    - name: Display Rancher access info
      debug:
        msg:
          - "Rancher deployed successfully!"
          - "Access: https://{{ first_server_ip }}:30443"
          - "Hostname: {{ addons.rancher.hostname | default('rancher.k3s.local') }}"
