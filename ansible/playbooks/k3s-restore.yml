---
- name: Restore cluster from etcd snapshot
  hosts: server[0]
  gather_facts: true
  become: yes
  any_errors_fatal: true

  vars:
    k3s_restore_snapshot: >-
      {{ snapshot_file if (snapshot_file is string and snapshot_file.startswith('/'))
         else (k3s_etcd_snapshot_dir ~ '/' ~ snapshot_file) }}
    k3s_restore_db_dir: "{{ k3s_data_dir }}/server/db"
    k3s_restore_db_backup: "{{ k3s_data_dir }}/server/db.bak.restore-{{ ansible_date_time.iso8601_basic_short }}-{{ ansible_date_time.epoch }}"
    k3s_restore_staging_dir: "{{ k3s_data_dir }}/server/restore-staging"
    k3s_restore_allow_version_mismatch: "{{ allow_version_mismatch | default(false) | bool }}"
    k3s_restore_k3s_version: "{{ restore_k3s_version | default('') }}"
    k3s_restore_expected_version: "{{ expected_k3s_version | default('') }}"
    k3s_restore_verify_configmap: "{{ verify_configmap | default('') }}"
    k3s_restore_verify_namespace: "{{ verify_namespace | default('rollback-demo') }}"
    k3s_restore_verify_absent_configmap: "{{ verify_absent_configmap | default('') }}"
    k3s_restore_node_ip: "{{ restore_node_ip | default(node_ip | default(first_server_ip)) }}"
    k3s_restore_allow_peer_url_mismatch: "{{ allow_peer_url_mismatch | default(false) | bool }}"

  tasks:
    - name: Assert snapshot_file is provided
      assert:
        that:
          - snapshot_file is defined
          - snapshot_file | length > 0
        fail_msg: "snapshot_file is required (path or filename under {{ k3s_etcd_snapshot_dir }})"

    - name: Verify snapshot file exists
      stat:
        path: "{{ k3s_restore_snapshot }}"
      register: snap_stat

    - name: Fail if snapshot not found
      fail:
        msg: "Snapshot file {{ k3s_restore_snapshot }} not found on {{ inventory_hostname }}"
      when: not snap_stat.stat.exists or not snap_stat.stat.isreg

    - name: Preflight - check embedded etcd db presence
      stat:
        path: "{{ k3s_restore_db_dir }}/etcd"
      register: etcd_db_stat

    - name: Preflight - warn/fail when etcd db is missing
      fail:
        msg: >-
          {{ k3s_restore_db_dir }}/etcd not found. This restore flow supports k3s embedded etcd snapshots only.
          If cluster uses sqlite/external datastore, use datastore-specific restore.
      when: not etcd_db_stat.stat.exists

    - name: Preflight - get current k3s version
      command: k3s --version
      register: k3s_current_version_cmd
      changed_when: false
      failed_when: false

    - name: Preflight - extract current k3s version
      set_fact:
        k3s_restore_current_version: >-
          {{ (k3s_current_version_cmd.stdout_lines | default(['unknown']) | first)
             | regex_search('v[0-9]+\.[0-9]+\.[0-9]+\+k3s[0-9]+') | default('unknown') }}

    - name: Preflight - inspect snapshot etcd member peer URLs
      shell: |
        set -euo pipefail
        TMPDIR=$(mktemp -d)
        cleanup() { rm -rf "$TMPDIR"; }
        trap cleanup EXIT
        SNAP="{{ k3s_restore_snapshot }}"
        DB="$TMPDIR/snap.db"
        if command -v etcdutl >/dev/null 2>&1; then
          etcdutl snapshot restore "$SNAP" --data-dir "$TMPDIR/etcd" --skip-hash-check >/dev/null 2>&1 || true
          [ -f "$TMPDIR/etcd/member/snap/db" ] && DB="$TMPDIR/etcd/member/snap/db"
        fi
        if [ ! -s "$DB" ]; then cp "$SNAP" "$DB"; fi
        strings "$DB" | grep -Eo 'https://[0-9.]+:2380' | sort -u || true
      args:
        executable: /bin/bash
      register: snapshot_peer_urls_cmd
      changed_when: false
      failed_when: false

    - name: Preflight - evaluate snapshot peer URL compatibility
      set_fact:
        k3s_restore_snapshot_peer_urls: "{{ snapshot_peer_urls_cmd.stdout_lines | default([]) | select('match', '^https://') | list }}"
        k3s_restore_expected_peer_url: "https://{{ k3s_restore_node_ip }}:2380"

    - name: Preflight - fail on snapshot peer URL mismatch
      assert:
        that:
          - k3s_restore_allow_peer_url_mismatch or (k3s_restore_snapshot_peer_urls | length == 0) or (k3s_restore_expected_peer_url in k3s_restore_snapshot_peer_urls)
        fail_msg: >-
          Snapshot etcd peer URL mismatch risk: snapshot has {{ k3s_restore_snapshot_peer_urls | default([]) }},
          but restore node expects {{ k3s_restore_expected_peer_url }} (restore_node_ip/node_ip).
          R2 evidence showed startup loop: 'this server is a not a member of the etcd cluster'.
          Restore on the original node/IP, or set allow_peer_url_mismatch=true only for rehearsed manual single-node recovery.

    - name: Preflight - version mismatch guard
      assert:
        that:
          - k3s_restore_allow_version_mismatch or k3s_restore_k3s_version | length > 0 or k3s_restore_expected_version | length == 0 or k3s_restore_current_version == k3s_restore_expected_version
        fail_msg: >-
          k3s version mismatch/risk: current={{ k3s_restore_current_version }}, expected={{ k3s_restore_expected_version | default('n/a') }}.
          Cross-minor or dirty-state restores can fail (R4 evidence: etcd peer URL/bootstrap mismatch).
          Set restore_k3s_version=<target> to reinstall compatible binary on all nodes, or set allow_version_mismatch=true only after isolated rehearsal.

    - name: Preflight - require explicit reinstall for cross-minor restore safety
      assert:
        that:
          - k3s_restore_k3s_version | length > 0 or k3s_restore_allow_version_mismatch or k3s_restore_expected_version | length == 0 or (k3s_restore_current_version.split('.')[:2] == k3s_restore_expected_version.split('.')[:2])
        fail_msg: >-
          Cross-minor restore detected (current={{ k3s_restore_current_version }}, expected={{ k3s_restore_expected_version }}).
          Provide restore_k3s_version=<compatible-version> to reinstall binaries before cluster-reset, or allow_version_mismatch=true only for rehearsed manual flows.

    - name: Stop k3s on all server nodes
      systemd:
        name: k3s
        state: stopped
      delegate_to: "{{ item }}"
      loop: "{{ groups['server'] }}"

    - name: Stop k3s-agent on all agent nodes
      systemd:
        name: k3s-agent
        state: stopped
      delegate_to: "{{ item }}"
      loop: "{{ groups.get('agent', []) }}"
      when: groups.get('agent', []) | length > 0

    - name: Optionally reinstall k3s binary on all server nodes
      shell: |
        set -euo pipefail
        export INSTALL_K3S_VERSION="{{ k3s_restore_k3s_version }}"
        export INSTALL_K3S_SKIP_START=true
        if [ -n "${INSTALL_K3S_MIRROR:-}" ]; then export INSTALL_K3S_MIRROR; fi
        curl -sfL https://rancher-mirror.rancher.cn/k3s/k3s-install.sh | sh -s - server
      args:
        executable: /bin/bash
      delegate_to: "{{ item }}"
      loop: "{{ groups['server'] }}"
      when: k3s_restore_k3s_version | length > 0

    - name: Optionally reinstall k3s binary on all agent nodes
      shell: |
        set -euo pipefail
        export INSTALL_K3S_VERSION="{{ k3s_restore_k3s_version }}"
        export INSTALL_K3S_SKIP_START=true
        if [ -n "${INSTALL_K3S_MIRROR:-}" ]; then export INSTALL_K3S_MIRROR; fi
        curl -sfL https://rancher-mirror.rancher.cn/k3s/k3s-install.sh | sh -s - agent
      args:
        executable: /bin/bash
      delegate_to: "{{ item }}"
      loop: "{{ groups.get('agent', []) }}"
      when: k3s_restore_k3s_version | length > 0 and groups.get('agent', []) | length > 0

    - name: Ensure restore staging dir exists
      file:
        path: "{{ k3s_restore_staging_dir }}"
        state: directory
        mode: '0700'

    - name: Stage snapshot before moving db dir
      copy:
        src: "{{ k3s_restore_snapshot }}"
        dest: "{{ k3s_restore_staging_dir }}/{{ k3s_restore_snapshot | basename }}"
        remote_src: true
        mode: '0600'

    - name: Check existing etcd db dir
      stat:
        path: "{{ k3s_restore_db_dir }}"
      register: db_stat

    - name: Move aside existing etcd db dir before restore
      command: mv "{{ k3s_restore_db_dir }}" "{{ k3s_restore_db_backup }}"
      when: db_stat.stat.exists

    - name: Ensure snapshot dir exists for restore
      file:
        path: "{{ k3s_etcd_snapshot_dir }}"
        state: directory
        mode: '0700'

    - name: Restore staged snapshot into snapshot dir
      copy:
        src: "{{ k3s_restore_staging_dir }}/{{ k3s_restore_snapshot | basename }}"
        dest: "{{ k3s_etcd_snapshot_dir }}/{{ k3s_restore_snapshot | basename }}"
        remote_src: true
        mode: '0600'

    - name: Detect existing k3s server args for cluster-reset
      shell: |
        set -euo pipefail
        svc=/etc/systemd/system/k3s.service
        for arg in --node-ip --advertise-address --flannel-iface --tls-san --data-dir; do
          val=$(awk -v a="'"$arg"'" '$0 ~ a {getline; gsub(/[[:space:]\047"]/, ""); print; exit}' "$svc" 2>/dev/null || true)
          if [ -n "$val" ]; then printf '%s=%s\n' "$arg" "$val"; fi
        done
      args:
        executable: /bin/bash
      register: k3s_service_args
      changed_when: false
      failed_when: false

    - name: Build cluster-reset args
      set_fact:
        k3s_reset_args: >-
          {{ [
              ('--node-ip=' ~ restore_node_ip) if (restore_node_ip | default('') | length > 0) else '',
              ('--advertise-address=' ~ restore_advertise_address) if (restore_advertise_address | default('') | length > 0) else '',
              ('--flannel-iface=' ~ restore_flannel_iface) if (restore_flannel_iface | default('') | length > 0) else '',
              restore_extra_args | default('')
            ] | select('string') | select('match', '.+') | join(' ') }}

    - name: Merge detected service args when explicit args missing
      set_fact:
        k3s_reset_args: >-
          {{ k3s_reset_args }}
          {{ (k3s_service_args.stdout_lines | default([]) | select('match','^--node-ip=') | list | first | default('')) if ('--node-ip=' not in k3s_reset_args) else '' }}
          {{ (k3s_service_args.stdout_lines | default([]) | select('match','^--advertise-address=') | list | first | default('')) if ('--advertise-address=' not in k3s_reset_args) else '' }}
          {{ (k3s_service_args.stdout_lines | default([]) | select('match','^--flannel-iface=') | list | first | default('')) if ('--flannel-iface=' not in k3s_reset_args) else '' }}

    - name: Run k3s cluster-reset restore
      shell: |
        set -euo pipefail
        k3s server --cluster-reset           --cluster-reset-restore-path={{ k3s_etcd_snapshot_dir }}/{{ k3s_restore_snapshot | basename }}           {{ k3s_reset_args | trim }}
      args:
        executable: /bin/bash
      register: restore_result
      changed_when: restore_result.rc == 0

    - name: Start k3s on first server
      systemd:
        name: k3s
        state: started
        enabled: true

    - name: Wait for API server
      wait_for:
        port: 6443
        delay: 10
        timeout: 180

    - name: Verify API /readyz
      command: kubectl get --raw=/readyz
      register: readyz
      retries: 18
      delay: 10
      until: readyz.rc == 0
      changed_when: false

    - name: Verify etcd member peer URL matches expected node IP
      shell: |
        set -euo pipefail
        db=/var/lib/rancher/k3s/server/db/etcd/member/snap/db
        expected="https://{{ k3s_restore_node_ip }}:2380"
        actual=$(strings "$db" 2>/dev/null | grep -Eo 'https://[0-9.]+:2380' | sort -u || true)
        echo "expected=$expected"
        echo "actual=$actual"
        if [ -n "$actual" ] && ! echo "$actual" | grep -qx "$expected"; then
          echo "MISMATCH: restore produced unexpected peer URL" >&2
          exit 1
        fi
      args:
        executable: /bin/bash
      register: peer_url_postcheck
      changed_when: false

    - name: Start k3s on remaining servers
      systemd:
        name: k3s
        state: started
      delegate_to: "{{ item }}"
      loop: "{{ groups['server'][1:] }}"
      when: groups['server'] | length > 1

    - name: Start k3s-agent on all agents
      systemd:
        name: k3s-agent
        state: started
      delegate_to: "{{ item }}"
      loop: "{{ groups.get('agent', []) }}"
      when: groups.get('agent', []) | length > 0

    - name: Post-verify - kubectl get nodes
      command: kubectl get nodes -o wide
      register: nodes_out
      changed_when: false
      retries: 12
      delay: 10
      until: nodes_out.rc == 0

    - name: Post-verify - expected configmap exists
      command: kubectl -n {{ k3s_restore_verify_namespace }} get configmap {{ k3s_restore_verify_configmap }}
      register: verify_cm
      changed_when: false
      when: k3s_restore_verify_configmap | length > 0

    - name: Post-verify - unexpected configmap absent
      command: kubectl -n {{ k3s_restore_verify_namespace }} get configmap {{ k3s_restore_verify_absent_configmap }}
      register: verify_absent_cm
      failed_when: verify_absent_cm.rc == 0
      changed_when: false
      when: k3s_restore_verify_absent_configmap | length > 0

    - name: Display restore summary
      debug:
        msg:
          - "Restore command completed on {{ inventory_hostname }}"
          - "Snapshot: {{ k3s_etcd_snapshot_dir }}/{{ k3s_restore_snapshot | basename }}"
          - "Old db moved to: {{ k3s_restore_db_backup if db_stat.stat.exists else '(none)' }}"
          - "Current k3s binary: {{ k3s_restore_current_version }}"
          - "Reinstall requested: {{ k3s_restore_k3s_version if k3s_restore_k3s_version | length > 0 else '(none)' }}"
          - "Nodes:"
          - "{{ nodes_out.stdout_lines }}"
          - "etcd restore rolls back cluster state, not PV data; verify workload/app semantics before reopening traffic."
