---
- name: Create systemd service for k3s-server
  template:
    src: k3s.service.j2
    dest: /etc/systemd/system/k3s.service
    mode: '0644'

- name: Enable and start k3s service
  systemd:
    name: k3s
    state: started
    enabled: true
    daemon_reload: true

- name: Wait for node token
  wait_for:
    path: "{{ k3s_token_file }}"
    delay: 5
    timeout: 90

- name: Copy kubeconfig to ansible host
  fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ playbook_dir }}/../../kubeconfig"
    flat: true
