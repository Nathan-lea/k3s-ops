---
- name: Assert k3s architecture is supported
  include_role:
    name: k3s-common
    tasks_from: assert-k3s-arch

- name: Set k3s upgrade download URL
  set_fact:
    k3s_upgrade_download_url: >-
      {{ k3s_upgrade_download_url | default('https://rancher-mirror.rancher.cn/k3s/' ~ (k3s_upgrade_version | replace('+', '-')) ~ '/k3s' ~ k3s_arch_suffix) }}

- name: Download new k3s binary
  get_url:
    url: "{{ k3s_upgrade_download_url }}"
    dest: "{{ k3s_server_bin }}"
    mode: '0755'
    force: yes
    timeout: 120

- name: Restart k3s service
  systemd:
    name: "{{ 'k3s' if node_role == 'server' else 'k3s-agent' }}"
    state: restarted
    daemon_reload: true

- name: Wait for node to be ready
  command: kubectl wait --for=condition=Ready node/{{ inventory_hostname }} --timeout=120s
  delegate_to: "{{ first_server_host }}"
  changed_when: false
