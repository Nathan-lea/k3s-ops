# =============================================================================
# IPAM — 集群节点的唯一事实源
# =============================================================================
# 谁在读它：production/lib/ipam.sh（校验）、production/lib/inventory.sh（生成 Ansible
#          inventory 与 extra_vars）、production/scale.sh（扩缩容 diff）。
#
# 三条硬规则（改之前先读）：
#   1. 文件里**第一条 role: server** 就是集群的 init 节点（etcd 第一个成员）。
#      它的位置有意义：不要随意调整顺序或改角色，除非你清楚代价。
#   2. 至少有 1 条 role: server，否则 bootstrap.sh 直接退出。
#   3. hostname 与 ip 都必须全局唯一；hostname 用完整主机名（不是短名）。
#
# hostname 命名：<前缀>-k8s-<两位序号>，前缀在 config/cluster.env 的 CLUSTER_NAME 里。
# 前缀和这里不一致只会告警（提示打错字），不会中断。
#
# 上限提示：嵌入式 etcd 建议 server 数为奇数（1 / 3 / 5）。3 台是测试与生产都稳妥的值。
# =============================================================================

# 网段仅用于"校验 IP 是否落在网段内"与"排除网段/网关地址"，不做自动分配。
subnet: 192.168.100.0/24
gateway: 192.168.100.1

# 仅记录（写进节点的 /etc/hosts 与 resolv 说明），不接管节点现有 DNS 配置。
dns:
  - 192.168.100.1

# 可选：Ingress 主机名后缀。cluster.env 里 CLUSTER_DOMAIN 留空时用它。
domain: k8s.example.com

nodes:
  # ---- 第 1 台：集群 init 节点（etcd 第一个成员）----
  - hostname: xxx-k8s-01
    ip: 192.168.100.11
    role: server

  # ---- 第 2 台：etcd 跟随节点 ----
  - hostname: xxx-k8s-02
    ip: 192.168.100.12
    role: server

  # ---- 第 3 台：etcd 跟随节点 ----
  - hostname: xxx-k8s-03
    ip: 192.168.100.13
    role: server

  # ---------------------------------------------------------------------------
  # 扩容示例：把 role 改成 agent 就是工作节点；新增节点按同样格式追加即可。
  # 追加后执行 ./production/scale.sh apply
  #
  # - hostname: xxx-k8s-04
  #   ip: 192.168.100.14
  #   role: agent
  #   labels:                              # 可选，落成 Node label
  #     node-role.example.com/worker: "true"
  # ---------------------------------------------------------------------------
