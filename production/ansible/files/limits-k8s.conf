# 由 production/ansible/playbooks/10-os-init.yml 下发到 /etc/security/limits.d/99-k3s-ops.conf
#
# 为什么需要: k3s / containerd / kubelet 都会打开大量文件描述符；
# 默认 soft nofile 1024 在高负载或节点上有较多 Pod 时会触发 "too many open files"。
# 这里调整的是登录会话的 limits；systemd 管理的 k3s.service 自身还有 LimitNOFILE=infinity
# （父角色 k3s.service.j2 里已经设置），两者互补。
*        soft    nofile      65535
*        hard    nofile      1048576
*        soft    nproc       65535
*        hard    nproc       65535
root     soft    nofile      65535
root     hard    nofile      1048576
