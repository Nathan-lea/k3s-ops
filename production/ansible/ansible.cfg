; =============================================================================
; production/ansible 的 Ansible 配置
; =============================================================================
; 通过 production/lib/config.sh 导出的 ANSIBLE_CONFIG 指向本文件。
; 手动跑时请在 production/ 目录下执行（roles_path 相对本配置文件所在目录）:
;   cd production && ANSIBLE_CONFIG=ansible/ansible.cfg \
;     ansible-playbook -i ansible/inventory/hosts.yml \
;                      -e @ansible/inventory/extra_vars.yml \
;                      ansible/playbooks/20-k3s-cluster.yml
; =============================================================================

[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = False
retry_files_enabled = False
nocows = True
interpreter_python = auto_silent
gathering = smart
forks = 10
display_skipped_hosts = False
deprecation_warnings = False
callbacks_enabled = profile_tasks
# 节点是运维账号 + sudo，不保留事实缓存，避免旧事实误导
fact_caching = memory

[ssh_connection]
pipelining = True
timeout = 30
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null

[privilege_escalation]
become = False
become_method = sudo
become_ask_pass = False
